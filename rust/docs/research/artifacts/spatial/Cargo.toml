[package]
name = "spatial_research"
version = "0.0.0"
edition = "2024"
publish = false

[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
bit-set = "0.11.1"
bitvec = "1.1.1"
crunch = "0.5.3"
delaunator = "1.1.0"
earcut = "0.4.12"
earcutr = "0.5.0"
etagere = "0.3.0"
fixedbitset = "0.5.9"
geo-index = "0.4.0"
guillotiere = "0.7.0"
i_triangle = "0.51.0"
kd-tree = "0.6.2"
kiddo = { version = "6.3.0", default-features = false }
rectangle-pack = "0.4.2"
rstar = "0.14.0"
spade = "2.15.1"
static_aabb2d_index = "2.1.0"
typenum = "1.20.1"

[profile.dev]
opt-level = 1

[profile.release]
overflow-checks = true
debug-assertions = true

# Keep this scratch project out of the parent workspace.
[workspace]
