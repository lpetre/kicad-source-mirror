[package]
name = "kicad-core"
description = "Port of KiCad common/ basics: KIID, layer ids and LSET, units and number formatting, text attributes, colours"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
kicad-sexpr = { path = "../kicad-sexpr" }
regress = "0.12.0"
serde_json = { version = "1.0.154", features = ["preserve_order", "float_roundtrip"] }

[dev-dependencies]
kicad-qa = { path = "../kicad-qa" }
