[package]
name = "kicad-session"
description = "Headless session (board + project + rules) and the pcbnew jobs (DRC, Gerber, drill, SVG, upgrade) shared by kicad-cli and kicad-wasm"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[features]
# Reference-dump driver (bin pcb-dump-session, package PCBIO-15): pcb-dump-rs on boards loaded
# through the session's load sequences.
dump = ["kicad-pcb/dump"]

[[bin]]
name = "pcb-dump-session"
path = "src/bin/pcb_dump_session.rs"
required-features = ["dump"]

[dependencies]
kicad-core = { path = "../kicad-core" }
kicad-geom = { path = "../kicad-geom" }
kicad-pcb = { path = "../kicad-pcb" }
kicad-sexpr = { path = "../kicad-sexpr" }
kicad-connectivity = { path = "../kicad-connectivity" }
kicad-drc = { path = "../kicad-drc" }
kicad-fab = { path = "../kicad-fab" }
kicad-plot = { path = "../kicad-plot" }
kicad-zone = { path = "../kicad-zone" }
serde = { version = "1.0.229", features = ["derive"] }

[dev-dependencies]
kicad-qa = { path = "../kicad-qa" }
# The reference dump's value formatters (`kicad_pcb::dump::format`) for the read API oracle
# (tests/board_api_read.rs).
kicad-pcb = { path = "../kicad-pcb", features = ["dump"] }
