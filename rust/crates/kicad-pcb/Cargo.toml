[package]
name = "kicad-pcb"
description = "Port of KiCad's board data model, .kicad_pcb reader/writer and project settings"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[features]
# Reference-dump support (src/dump, bin pcb-dump-rs): prints the model in the line format of
# rust/tools/pcb-dump (docs/PCB_DUMP_FORMAT.md) for differential testing against the C++.
dump = []

[[bin]]
name = "pcb-dump-rs"
path = "src/bin/pcb_dump_rs.rs"
required-features = ["dump"]

[dependencies]
kicad-geom = { path = "../kicad-geom" }
kicad-core = { path = "../kicad-core" }
kicad-sexpr = { path = "../kicad-sexpr" }
kicad-font = { path = "../kicad-font" }

[dev-dependencies]
kicad-qa = { path = "../kicad-qa" }
